<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試作品レビューアプリ｜エポラーシェ</title>
<style>
  :root{
    --pink-50:#fff8f8;
    --pink-100:#fbeeee;
    --pink-200:#f4dede;
    --pink-300:#e9c9c9;
    --beige-50:#fdfaf6;
    --beige-100:#f7f0e8;
    --beige-200:#eadfd2;
    --rose:#c68f92;
    --rose-dark:#9d686d;
    --rose-deep:#7c5055;
    --text:#403634;
    --sub:#766966;
    --muted:#9b8f8b;
    --card:rgba(255,255,255,.92);
    --white:#fff;
    --border:#eadfda;
    --success-bg:#edf6ef;
    --success:#55785e;
    --danger:#b76666;
    --shadow:0 10px 30px rgba(126,91,85,.08);
    --shadow-hover:0 14px 34px rgba(126,91,85,.13);
    --radius-lg:22px;
    --radius-md:15px;
    --radius-sm:11px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(246,220,220,.75), transparent 30%),
      radial-gradient(circle at 88% 8%, rgba(239,229,215,.82), transparent 31%),
      linear-gradient(180deg,#fffaf9 0%,#fbf6f1 48%,#f8f2ec 100%);
    color:var(--text);
    padding:28px 16px 72px;
    letter-spacing:.01em;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);
    background-size:32px 32px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 60%);
  }

  .wrap{max-width:820px;margin:0 auto;position:relative;z-index:1;}
  h1{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:clamp(23px,4vw,32px);
    font-weight:700;
    text-align:center;
    margin:12px 0 7px;
    color:var(--rose-deep);
    letter-spacing:.08em;
  }
  h1::before{
    content:"EPORASHE";
    display:block;
    font-family:Georgia,"Times New Roman",serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.32em;
    color:var(--rose);
    margin-bottom:8px;
  }
  .sub-title{
    text-align:center;
    color:var(--sub);
    font-size:12px;
    letter-spacing:.12em;
    margin-bottom:28px;
  }

  /* 上部の大タブ */
  .main-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:6px;
    margin-bottom:22px;
    background:rgba(255,255,255,.68);
    border:1px solid rgba(234,223,218,.9);
    border-radius:18px;
    box-shadow:0 5px 20px rgba(126,91,85,.06);
    backdrop-filter:blur(10px);
  }
  .main-tab-btn{
    padding:13px 14px;
    border:0;
    background:transparent;
    border-radius:13px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    color:var(--sub);
    transition:.2s ease;
  }
  .main-tab-btn:hover{background:var(--pink-50);color:var(--rose-dark);}
  .main-tab-btn.active{
    background:linear-gradient(135deg,#d9aaa9 0%,#bf8588 100%);
    color:#fff;
    box-shadow:0 8px 20px rgba(181,125,129,.23);
  }

  /* 管理者内の小タブ */
  .sub-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
    padding:5px;
    background:rgba(255,255,255,.65);
    border:1px solid var(--border);
    border-radius:16px;
  }
  .tab-btn{
    flex:1 1 150px;
    padding:10px 14px;
    border:0;
    background:transparent;
    border-radius:11px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    color:var(--sub);
    transition:.2s ease;
  }
  .tab-btn:hover{background:var(--beige-50);color:var(--rose-dark);}
  .tab-btn.active{
    background:var(--beige-100);
    color:var(--rose-deep);
    box-shadow:inset 0 0 0 1px var(--beige-200);
  }

  .card{
    background:var(--card);
    border:1px solid rgba(234,223,218,.95);
    border-radius:var(--radius-lg);
    padding:24px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(8px);
  }
  .card:hover{box-shadow:var(--shadow-hover);}

  .product-name{
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    font-size:22px;
    font-weight:700;
    color:var(--rose-deep);
    margin-bottom:10px;
    padding-left:15px;
    position:relative;
  }
  .product-name::before{
    content:"";
    position:absolute;
    left:0;
    top:4px;
    bottom:4px;
    width:4px;
    border-radius:4px;
    background:linear-gradient(var(--pink-300),var(--rose));
  }
  .product-features{
    font-size:13px;
    line-height:1.9;
    color:var(--text);
    white-space:pre-wrap;
    background:linear-gradient(135deg,var(--beige-50),#fff9f8);
    padding:15px 16px;
    border:1px solid #f0e6df;
    border-radius:14px;
  }
  .deadline{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    color:#a55f63;
    margin-top:12px;
    padding:6px 10px;
    background:#fff2f2;
    border-radius:999px;
  }
  .deadline::before{content:"◷";font-size:13px;}

  label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin:18px 0 7px;
    color:#5d4b48;
  }
  input[type=text], input[type=date], select, textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid #dfd4ce;
    border-radius:12px;
    font-size:14px;
    font-family:inherit;
    background:rgba(255,255,255,.96);
    color:var(--text);
    outline:none;
    transition:border-color .18s,box-shadow .18s,background .18s;
  }
  input[type=text]::placeholder,textarea::placeholder{color:#b2a6a1;}
  input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{
    border-color:#d0a4a5;
    box-shadow:0 0 0 4px rgba(208,164,165,.13);
    background:#fff;
  }
  textarea{min-height:100px;resize:vertical;line-height:1.7;}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9d7777 50%),linear-gradient(135deg,#9d7777 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px;}

  button{
    padding:11px 18px;
    background:linear-gradient(135deg,#cf9b9d 0%,#b97f83 100%);
    color:#fff;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(185,127,131,.18);
    transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
  }
  button.block{width:100%;padding:15px;margin-top:24px;font-size:15px;letter-spacing:.04em;}
  button.secondary{background:#fff;color:var(--rose-dark);border:1px solid #d8b7b5;box-shadow:none;}
  button.danger{background:#fff;color:var(--danger);border:1px solid #e3bcbc;box-shadow:none;}
  button:disabled{background:#d6ceca;color:#fff;cursor:default;box-shadow:none;}
  button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 20px rgba(185,127,131,.23);}
  button.secondary:hover:not(:disabled),button.danger:hover:not(:disabled){box-shadow:0 6px 14px rgba(112,82,77,.09);}

  .q-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:9px;
    padding:8px;
    border-radius:13px;
    background:var(--beige-50);
    border:1px solid #f0e6df;
  }
  .q-row input{flex:1;background:#fff;}
  .q-row button{flex-shrink:0;padding:9px 11px;}
  .actions{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap;}

  .campaign-list-item{
    border:1px solid var(--border);
    border-radius:15px;
    padding:14px 15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:linear-gradient(135deg,#fff,var(--beige-50));
  }
  .campaign-list-item .info{flex:1;min-width:210px;}
  .campaign-list-item .info .name{font-weight:800;color:var(--rose-deep);font-size:14px;}
  .campaign-list-item .info .meta{font-size:12px;color:var(--sub);margin-top:3px;}
  .badge{
    font-size:11px;
    font-weight:700;
    padding:5px 9px;
    border-radius:999px;
    background:var(--success-bg);
    color:var(--success);
    border:1px solid #dcebdd;
  }
  .badge.off{background:#f1efed;color:#938985;border-color:#e5dfdb;}

  #resultTableWrap{overflow-x:auto;margin-top:16px;border-radius:14px;}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:720px;background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  th,td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px;text-align:left;vertical-align:top;line-height:1.55;}
  th:last-child,td:last-child{border-right:none;}
  tr:last-child td{border-bottom:none;}
  th{background:var(--beige-100);white-space:nowrap;color:#665552;font-weight:800;position:sticky;top:0;}
  tr:nth-child(even) td{background:#fffdfb;}

  .login-box{max-width:400px;margin:36px auto;text-align:left;}
  .login-box::before{
    content:"ADMIN";
    display:block;
    text-align:center;
    font-family:Georgia,serif;
    letter-spacing:.22em;
    color:var(--rose);
    font-size:11px;
    margin-bottom:10px;
  }
  .msg{
    text-align:center;
    padding:34px 18px;
    color:var(--sub);
    line-height:1.8;
    background:rgba(255,255,255,.45);
    border:1px dashed #e2d4ce;
    border-radius:18px;
  }
  .success{
    text-align:center;
    padding:48px 22px;
    background:rgba(255,255,255,.78);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
  }
  .success::before{
    content:"✓";
    display:grid;
    place-items:center;
    width:54px;
    height:54px;
    margin:0 auto 14px;
    border-radius:50%;
    background:var(--success-bg);
    color:var(--success);
    font-size:27px;
    font-weight:700;
  }
  .success h2{color:var(--rose-deep);margin-bottom:8px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;}
  .success p{color:var(--sub);margin-bottom:20px;}
  .required{color:#b86767;font-weight:700;margin-left:4px;}

  input[type=checkbox]{accent-color:#c68f92;transform:translateY(1px);}

  .question-editor{
    border:1px solid var(--border);
    background:#fffdfb;
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
  }
  .question-editor .q-row{margin-bottom:9px;}
  .question-option{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    color:var(--text);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .question-option input{width:auto;margin:0;}
  .question-option .hint{color:var(--sub);font-weight:500;}

  .rating-question{
    margin:16px 0 22px;
    padding:16px;
    border:1px solid #eadbd6;
    border-radius:16px;
    background:linear-gradient(145deg,#fffafa 0%,#fdf8f2 100%);
  }
  .rating-question>label{margin-top:0;}
  .rating-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0 12px;}
  .rating-choice{position:relative;}
  .rating-choice input{position:absolute;opacity:0;pointer-events:none;}
  .rating-choice span{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:56px;
    border:1px solid #e4d4cf;
    border-radius:12px;
    background:#fff;
    color:#76625e;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
  }
  .rating-choice span small{font-size:10px;font-weight:600;color:var(--sub);margin-top:2px;}
  .rating-choice input:checked+span{
    background:linear-gradient(135deg,#d7a7a9,#c48c91);
    border-color:#c48c91;
    color:#fff;
    box-shadow:0 5px 14px rgba(171,115,120,.18);
  }
  .rating-choice input:checked+span small{color:#fff8f8;}
  .rating-note-label{font-size:12px!important;margin:8px 0 5px!important;color:var(--sub)!important;}
  .rating-question textarea{min-height:68px;}
  .result-score{font-weight:800;color:var(--rose-deep);white-space:nowrap;}
  .result-note{display:block;margin-top:5px;color:var(--sub);font-size:11px;line-height:1.45;white-space:pre-wrap;}
  .excel-btn{background:#fff;color:#6e5a55;border:1px solid #d7c1ba;}

  @media (max-width:640px){
    body{padding:20px 12px 50px;}
    .sub-title{margin-bottom:20px;}
    .card{padding:18px;border-radius:18px;}
    .main-tabs{border-radius:15px;}
    .main-tab-btn{font-size:13px;padding:12px 8px;}
    .tab-btn{flex:1 1 100%;}
    .product-name{font-size:19px;}
    .campaign-list-item{align-items:stretch;}
    .campaign-list-item .info{min-width:100%;}
    .campaign-list-item button{flex:1;}
    .actions>button{flex:1 1 160px;}
    .q-row{align-items:stretch;}
    .q-row button{padding-inline:10px;}
  }
</style>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>試作品レビューアプリ</h1>
  <div class="sub-title">エポラーシェ商品企画室</div>

  <div class="main-tabs">
    <button class="main-tab-btn" id="mainTabReview" onclick="switchMainTab('review')">レビュー入力</button>
    <button class="main-tab-btn" id="mainTabAdmin" onclick="switchMainTab('admin')">管理者用</button>
  </div>

  <div id="app"></div>
</div>

<script>
/* ==== ここをデプロイ後のGAS URLに差し替えてください ==== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxB9KV9bmIQ5EGTSTlKFjKJpessdSKDQG4JISpuWH2azbGJx30ptbyHdpRh-8SOd0-E/exec';
/* ======================================================= */

const app = document.getElementById('app');
let mainTab = 'review';

/* =====================================================
   共通：大タブの切り替え
===================================================== */
function switchMainTab(tab) {
  mainTab = tab;
  document.getElementById('mainTabReview').className = 'main-tab-btn' + (tab === 'review' ? ' active' : '');
  document.getElementById('mainTabAdmin').className = 'main-tab-btn' + (tab === 'admin' ? ' active' : '');
  if (tab === 'review') {
    renderReviewInit();
  } else {
    renderAdminInit();
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(str) { return escapeHtml(str); }

/* =====================================================
   レビュー入力側（回答者用）
   ※ 他の人の回答は一切取得しない
===================================================== */
let campaigns = [];
let selectedCampaign = null;

async function renderReviewInit() {
  app.innerHTML = '<div class="msg">読み込み中です…</div>';
  selectedCampaign = null;
  try {
    const res = await fetch(GAS_URL + '?action=getActiveCampaigns');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    campaigns = data;
    renderReview();
  } catch (err) {
    app.innerHTML = '<div class="msg">読み込みに失敗しました。時間をおいて再度お試しください。<br>(' + err.message + ')</div>';
  }
}

function renderReview() {
  if (!campaigns.length) {
    app.innerHTML = '<div class="msg">現在、募集中の試作品レビューはありません。</div>';
    return;
  }
  if (!selectedCampaign) {
    if (campaigns.length === 1) {
      selectedCampaign = campaigns[0];
      renderReviewForm();
      return;
    }
    let opts = '<option value="">選択してください</option>';
    campaigns.forEach((c, i) => {
      opts += `<option value="${i}">${escapeHtml(c.productName)}</option>`;
    });
    app.innerHTML = `
      <div class="card">
        <label>レビューする商品を選んでください</label>
        <select id="campaignSelect">${opts}</select>
      </div>`;
    document.getElementById('campaignSelect').addEventListener('change', (e) => {
      const idx = e.target.value;
      if (idx === '') return;
      selectedCampaign = campaigns[idx];
      renderReviewForm();
    });
    return;
  }
  renderReviewForm();
}

function renderReviewForm() {
  const c = selectedCampaign;
  let questionsHtml = '';
  (c.questions || []).forEach(q => {
    if (q.rating5) {
      questionsHtml += `
        <div class="rating-question">
          <label>${escapeHtml(q.label)}<span class="required">※</span></label>
          <div class="rating-scale" role="radiogroup" aria-label="${escapeAttr(q.label)} 5段階評価">
            ${[1,2,3,4,5].map(n => `
              <label class="rating-choice">
                <input type="radio" name="q_${q.id}" value="${n}" required>
                <span>${n}<small>${n===1?'低い':n===5?'高い':''}</small></span>
              </label>`).join('')}
          </div>
          <label class="rating-note-label">備考・補足（任意）</label>
          <textarea name="q_${q.id}_note" placeholder="評価について補足があれば入力してください"></textarea>
        </div>`;
    } else {
      questionsHtml += `
        <label>${escapeHtml(q.label)}<span class="required">※</span></label>
        <textarea name="q_${q.id}" required></textarea>`;
    }
  });

  app.innerHTML = `
    <div class="card">
      <div class="product-name">${escapeHtml(c.productName)}</div>
      ${c.features ? `<div class="product-features">${escapeHtml(c.features)}</div>` : ''}
      ${c.deadline ? `<div class="deadline">入力期限：${escapeHtml(c.deadline)}</div>` : ''}
    </div>
    <form id="reviewForm" class="card">
      <label>お名前<span class="required">※</span></label>
      <input type="text" name="reviewerName" required>

      <label>部署</label>
      <input type="text" name="department" placeholder="例：経理／広報／店舗など">

      ${questionsHtml}

      <button type="submit" class="block">この内容で送信する</button>
    </form>
  `;

  document.getElementById('reviewForm').addEventListener('submit', onSubmitReview);
}

async function onSubmitReview(e) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = '送信中…';

  const answers = {};
  (selectedCampaign.questions || []).forEach(q => {
    const el = form.querySelector(`[name="q_${q.id}"]:checked`) || form.querySelector(`[name="q_${q.id}"]`);
    answers[q.label] = el ? el.value : '';
    if (q.rating5) {
      const note = form.querySelector(`[name="q_${q.id}_note"]`);
      answers[q.label + '__note'] = note ? note.value : '';
    }
  });

  const payload = {
    action: 'submitReview',
    campaignId: selectedCampaign.id,
    productName: selectedCampaign.productName,
    reviewerName: form.reviewerName.value,
    department: form.department.value,
    answers: answers
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    showReviewSuccess();
  } catch (err) {
    alert('送信に失敗しました。もう一度お試しください。\n(' + err.message + ')');
    btn.disabled = false;
    btn.textContent = 'この内容で送信する';
  }
}

function showReviewSuccess() {
  app.innerHTML = `
    <div class="success">
      <h2>ご回答ありがとうございました！</h2>
      <p>レビューを送信しました。</p>
      <button onclick="renderReviewInit()">別の商品もレビューする</button>
    </div>`;
}

/* =====================================================
   管理者用（合言葉で保護）
===================================================== */
let adminPassword = sessionStorage.getItem('review_admin_pw') || '';
let adminTab = 'new';
let editingCampaign = null;
let questionDraft = [];

function renderAdminInit() {
  if (adminPassword) {
    verifyAdminPassword();
  } else {
    renderAdminLogin();
  }
}

function renderAdminLogin() {
  app.innerHTML = `
    <div class="login-box card">
      <label>合言葉を入力してください</label>
      <input type="text" id="pwInput">
      <div class="actions" style="justify-content:center;">
        <button onclick="tryAdminLogin()">入る</button>
      </div>
    </div>`;
}

function tryAdminLogin() {
  adminPassword = document.getElementById('pwInput').value;
  verifyAdminPassword();
}

async function verifyAdminPassword() {
  try {
    const res = await fetch(GAS_URL + '?action=getAllCampaigns&password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (data.error) {
      alert('合言葉が違います');
      adminPassword = '';
      renderAdminLogin();
      return;
    }
    sessionStorage.setItem('review_admin_pw', adminPassword);
    adminTab = 'new';
    renderAdminMain();
  } catch (err) {
    alert('通信に失敗しました: ' + err.message);
  }
}

function renderAdminMain() {
  app.innerHTML = `
    <div class="sub-tabs">
      <button class="tab-btn ${adminTab==='new'?'active':''}" onclick="switchAdminTab('new')">質問を登録する</button>
      <button class="tab-btn ${adminTab==='list'?'active':''}" onclick="switchAdminTab('list')">案件一覧・編集</button>
      <button class="tab-btn ${adminTab==='results'?'active':''}" onclick="switchAdminTab('results')">結果を見る</button>
    </div>
    <div id="adminBody"></div>
  `;
  if (adminTab === 'new') renderNewForm();
  if (adminTab === 'list') renderList();
  if (adminTab === 'results') renderResults();
}

function switchAdminTab(tab) {
  adminTab = tab;
  editingCampaign = null;
  renderAdminMain();
}

/* ---------- 質問登録 ---------- */

function renderNewForm() {
  const c = editingCampaign || { productName:'', features:'', deadline:'', active:true, questions: defaultQuestions() };
  questionDraft = JSON.parse(JSON.stringify(c.questions || []));

  const body = document.getElementById('adminBody');
  body.innerHTML = `
    <div class="card">
      <label>商品名<span class="required">※</span></label>
      <input type="text" id="f_productName" value="${escapeAttr(c.productName)}">

      <label>特徴・説明（レビュー画面に表示されます）</label>
      <textarea id="f_features">${escapeHtml(c.features)}</textarea>

      <label>入力期限（任意）</label>
      <input type="date" id="f_deadline" value="${escapeAttr(c.deadline)}">

      <label>質問項目</label>
      <div id="questionList"></div>
      <button type="button" class="secondary" onclick="addQuestion()">＋ 質問を追加</button>

      <label style="margin-top:20px;">
        <input type="checkbox" id="f_active" ${c.active?'checked':''} style="width:auto;"> 現在レビュー募集中にする（オンにするとレビュー入力タブに表示されます）
      </label>

      <div class="actions">
        <button onclick="saveCampaign()">${editingCampaign ? '更新する' : 'この内容で登録する'}</button>
        ${editingCampaign ? '<button class="secondary" onclick="cancelEdit()">新規登録に戻る</button>' : ''}
      </div>
    </div>
  `;
  renderQuestionList();
}

function defaultQuestions() {
  return [
    {id:'q_'+Math.random().toString(36).slice(2), label:'年代', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'肌質', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'第一印象', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'感想', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'お客様受け', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'説明しやすさ', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'他社差別化', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'総合評価', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'推奨度（10点中）', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'部署コメント', rating5:false},
    {id:'q_'+Math.random().toString(36).slice(2), label:'個人一言コメント', rating5:false}
  ];
}

function renderQuestionList() {
  const el = document.getElementById('questionList');
  el.innerHTML = questionDraft.map((q, i) => `
    <div class="question-editor">
      <div class="q-row">
        <input type="text" value="${escapeAttr(q.label)}" onchange="updateQuestionLabel(${i}, this.value)" placeholder="質問内容を入力">
        <button type="button" class="danger" onclick="removeQuestion(${i})">削除</button>
      </div>
      <label class="question-option">
        <input type="checkbox" ${q.rating5?'checked':''} onchange="updateQuestionRating(${i}, this.checked)">
        5段階評価にする
        <span class="hint">（1〜5＋備考欄を表示）</span>
      </label>
    </div>
  `).join('');
}

function addQuestion() {
  questionDraft.push({ id: 'q_' + Math.random().toString(36).slice(2), label: '', rating5:false });
  renderQuestionList();
}
function updateQuestionLabel(i, val) { questionDraft[i].label = val; }
function updateQuestionRating(i, checked) { questionDraft[i].rating5 = !!checked; }
function removeQuestion(i) { questionDraft.splice(i, 1); renderQuestionList(); }

async function saveCampaign() {
  const productName = document.getElementById('f_productName').value.trim();
  if (!productName) { alert('商品名を入力してください'); return; }
  const questions = questionDraft.filter(q => q.label.trim() !== '');

  const campaign = {
    id: editingCampaign ? editingCampaign.id : undefined,
    productName: productName,
    features: document.getElementById('f_features').value,
    deadline: document.getElementById('f_deadline').value,
    active: document.getElementById('f_active').checked,
    questions: questions
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveCampaign', password: adminPassword, campaign })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    alert('保存しました');
    editingCampaign = null;
    switchAdminTab('list');
  } catch (err) {
    alert('保存に失敗しました: ' + err.message);
  }
}

function cancelEdit() {
  editingCampaign = null;
  renderNewForm();
}

/* ---------- 案件一覧 ---------- */

async function renderList() {
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getAllCampaigns&password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const list = data.campaigns || [];
    if (!list.length) {
      body.innerHTML = '<div class="card msg">まだ案件がありません。「質問を登録する」タブから作成してください。</div>';
      return;
    }
    body.innerHTML = '<div class="card">' + list.map(c => `
      <div class="campaign-list-item">
        <div class="info">
          <div class="name">${escapeHtml(c.productName)}</div>
          <div class="meta">質問${(c.questions||[]).length}件${c.deadline ? '・期限 '+escapeHtml(c.deadline) : ''}</div>
        </div>
        <span class="badge ${c.active?'':'off'}">${c.active?'募集中':'非公開'}</span>
        <button class="secondary" onclick='editCampaign(${JSON.stringify(c.id)})'>編集</button>
        <button class="danger" onclick='deleteCampaignConfirm(${JSON.stringify(c.id)})'>削除</button>
      </div>
    `).join('') + '</div>';
    window._campaignsCache = list;
  } catch (err) {
    body.innerHTML = '<div class="card msg">読み込みに失敗しました: ' + err.message + '</div>';
  }
}

function editCampaign(id) {
  const c = (window._campaignsCache || []).find(c => c.id === id);
  if (!c) return;
  editingCampaign = c;
  adminTab = 'new';
  renderAdminMain();
}

async function deleteCampaignConfirm(id) {
  if (!confirm('この案件を削除します。よろしいですか？（レビュー履歴自体は消えません）')) return;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteCampaign', password: adminPassword, campaignId: id })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderList();
  } catch (err) {
    alert('削除に失敗しました: ' + err.message);
  }
}

/* ---------- 結果閲覧 ---------- */

async function renderResults() {
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getAllCampaigns&password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const list = data.campaigns || [];
    let opts = list.map(c => `<option value="${escapeAttr(c.id)}">${escapeHtml(c.productName)}</option>`).join('');
    body.innerHTML = `
      <div class="card">
        <label>結果を見る案件</label>
        <select id="resultSelect">${opts}</select>
        <div class="actions">
          <button onclick="loadResults()">表示する</button>
          <button class="excel-btn" id="excelExportBtn" onclick="exportResultsExcel()" disabled>Excelに出力</button>
        </div>
        <div id="resultTableWrap"></div>
      </div>`;
    window._campaignsCache = list;
    if (list.length) loadResults();
  } catch (err) {
    body.innerHTML = '<div class="card msg">読み込みに失敗しました: ' + err.message + '</div>';
  }
}

async function loadResults() {
  const select = document.getElementById('resultSelect');
  const campaignId = select.value;
  const campaign = (window._campaignsCache || []).find(c => c.id === campaignId);
  const wrap = document.getElementById('resultTableWrap');
  const exportBtn = document.getElementById('excelExportBtn');
  if (exportBtn) exportBtn.disabled = true;
  wrap.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getReviews&campaignId=' + encodeURIComponent(campaignId) + '&password=' + encodeURIComponent(adminPassword));
    const reviews = await res.json();
    if (reviews.error) throw new Error(reviews.error);
    if (!reviews.length) {
      window._resultsCache = null;
      wrap.innerHTML = '<div class="msg">まだ回答がありません。</div>';
      return;
    }
    const questions = campaign ? (campaign.questions || []) : [];
    let html = '<table><tr><th>日時</th><th>名前</th><th>部署</th>';
    questions.forEach(q => html += `<th>${escapeHtml(q.label)}${q.rating5 ? '（5段階）' : ''}</th>`);
    html += '<th>操作</th></tr>';
    reviews.forEach((r, reviewIndex) => {
      html += `<tr><td>${formatDate(r.timestamp)}</td><td>${escapeHtml(r.reviewerName)}</td><td>${escapeHtml(r.department)}</td>`;
      questions.forEach(q => {
        const ans = (r.answers || {})[q.label] || '';
        if (q.rating5) {
          const note = (r.answers || {})[q.label + '__note'] || '';
          html += `<td><span class="result-score">${escapeHtml(ans)} / 5</span>${note ? `<span class="result-note">備考：${escapeHtml(note)}</span>` : ''}</td>`;
        } else {
          html += `<td>${escapeHtml(ans)}</td>`;
        }
      });
      html += `<td><button type="button" class="danger" style="padding:7px 10px;font-size:12px;white-space:nowrap" onclick="deleteReviewConfirm(${reviewIndex})">削除</button></td>`;
      html += '</tr>';
    });
    html += '</table>';
    wrap.innerHTML = html;
    window._resultsCache = { campaign, reviews };
    if (exportBtn) exportBtn.disabled = false;
  } catch (err) {
    window._resultsCache = null;
    wrap.innerHTML = '<div class="msg">読み込みに失敗しました: ' + err.message + '</div>';
  }
}

async function deleteReviewConfirm(reviewIndex) {
  const cache = window._resultsCache;
  if (!cache || !cache.reviews || !cache.reviews[reviewIndex]) return;
  const review = cache.reviews[reviewIndex];
  if (!confirm('この回答を削除します。よろしいですか？\n\n削除した回答は結果一覧・Excel出力の両方から除外されます。')) return;

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'deleteReview',
        password: adminPassword,
        campaignId: cache.campaign.id,
        reviewRow: review.reviewRow
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    await loadResults();
  } catch (err) {
    alert('削除に失敗しました: ' + err.message);
  }
}

function exportResultsExcel() {
  const cache = window._resultsCache;
  if (!cache || !cache.reviews || !cache.reviews.length) {
    alert('出力できる回答がありません');
    return;
  }
  if (typeof XLSX === 'undefined') {
    alert('Excel出力ライブラリの読み込みに失敗しました。インターネット接続を確認して再読み込みしてください。');
    return;
  }

  const campaign = cache.campaign || { productName:'レビュー結果', questions:[] };
  const questions = campaign.questions || [];
  const headers = ['日時','名前','部署'];
  questions.forEach(q => {
    if (q.rating5) {
      headers.push(q.label + '（評価1〜5）');
      headers.push(q.label + '（備考）');
    } else {
      headers.push(q.label);
    }
  });

  const rows = cache.reviews.map(r => {
    const row = [formatDate(r.timestamp), r.reviewerName || '', r.department || ''];
    questions.forEach(q => {
      const answers = r.answers || {};
      if (q.rating5) {
        const score = answers[q.label] || '';
        row.push(score === '' ? '' : Number(score));
        row.push(answers[q.label + '__note'] || '');
      } else {
        row.push(answers[q.label] || '');
      }
    });
    return row;
  });

  const aoa = [];
  aoa.push([campaign.productName + '　レビュー集計表']);
  aoa.push(['出力日時', new Date().toLocaleString('ja-JP')]);
  aoa.push(['回答数', cache.reviews.length]);
  aoa.push([]);
  aoa.push(headers);
  aoa.push(...rows);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const lastCol = headers.length - 1;
  ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:lastCol} }];
  ws['!cols'] = headers.map((h,i) => ({ wch: i < 3 ? (i === 0 ? 20 : 14) : Math.max(16, Math.min(34, String(h).length * 2 + 4)) }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:4,c:0},e:{r:4,c:lastCol}}) };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'レビュー結果');
  const safeName = String(campaign.productName || 'レビュー結果').replace(/[\\/:*?"<>|]/g,'_');
  XLSX.writeFile(wb, safeName + '_レビュー結果.xlsx', { compression:true });
}

function formatDate(v) {
  const d = new Date(v);
  if (isNaN(d.getTime())) return v;
  return d.toLocaleString('ja-JP');
}

/* =====================================================
   起動
===================================================== */
switchMainTab('review');
</script>
</body>
</html>
