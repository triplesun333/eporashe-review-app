<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試作品レビューアプリ｜エポラーシェ</title>
<style>
  :root{
    --main:#b98a5e;
    --main-dark:#8a6540;
    --bg:#faf6f1;
    --card:#ffffff;
    --border:#e6ddd2;
    --text:#3a332c;
    --sub:#8a7f70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:19px;text-align:center;margin-bottom:4px;color:var(--main-dark);}
  .sub-title{text-align:center;color:var(--sub);font-size:13px;margin-bottom:20px;}

  /* 上部の大タブ（レビュー入力／管理者用） */
  .main-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .main-tab-btn{
    flex:1;padding:12px;border:1px solid var(--border);background:#fff;
    border-radius:10px;cursor:pointer;font-size:14px;font-weight:bold;color:var(--sub);
  }
  .main-tab-btn.active{background:var(--main-dark);color:#fff;border-color:var(--main-dark);}

  /* 管理者内の小タブ */
  .sub-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .tab-btn{
    padding:9px 14px;border:1px solid var(--border);background:#fff;
    border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold;color:var(--sub);
  }
  .tab-btn.active{background:var(--main);color:#fff;border-color:var(--main);}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:20px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.04);
  }
  .product-name{font-size:17px;font-weight:bold;color:var(--main-dark);margin-bottom:6px;}
  .product-features{
    font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;
    background:var(--bg);padding:12px;border-radius:8px;
  }
  .deadline{font-size:12px;color:#b25c5c;margin-top:8px;}

  label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px;color:var(--main-dark);}
  input[type=text], input[type=date], select, textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
  }
  textarea{min-height:80px;resize:vertical;}

  button{
    padding:11px 18px;background:var(--main);color:#fff;font-size:14px;font-weight:bold;
    border:none;border-radius:8px;cursor:pointer;
  }
  button.block{width:100%;padding:14px;margin-top:20px;}
  button.secondary{background:#fff;color:var(--main-dark);border:1px solid var(--main);}
  button.danger{background:#fff;color:#b25c5c;border:1px solid #b25c5c;}
  button:disabled{background:#ccc;cursor:default;}
  button:hover:not(:disabled){opacity:0.85;}

  .q-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .q-row input{flex:1;}
  .q-row button{flex-shrink:0;padding:8px 10px;}
  .actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}

  .campaign-list-item{
    border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .campaign-list-item .info{flex:1;min-width:200px;}
  .campaign-list-item .info .name{font-weight:bold;color:var(--main-dark);}
  .campaign-list-item .info .meta{font-size:12px;color:var(--sub);}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8f3e6;color:#4a7a45;}
  .badge.off{background:#eee;color:#999;}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
  th,td{border:1px solid var(--border);padding:8px;text-align:left;vertical-align:top;}
  th{background:var(--bg);white-space:nowrap;}

  .login-box{max-width:360px;margin:40px auto;text-align:center;}
  .msg{text-align:center;padding:30px 16px;color:var(--sub);}
  .success{text-align:center;padding:40px 16px;}
  .success h2{color:var(--main-dark);margin-bottom:8px;}
  .required{color:#b25c5c;font-weight:normal;margin-left:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>試作品レビューアプリ</h1>
  <div class="sub-title">エポラーシェ商品企画室</div>

  <div class="main-tabs">
    <button class="main-tab-btn" id="mainTabReview" onclick="switchMainTab('review')">レビュー入力</button>
    <button class="main-tab-btn" id="mainTabAdmin" onclick="switchMainTab('admin')">管理者用</button>
  </div>

  <div id="app"></div>
</div>

<script>
/* ==== ここをデプロイ後のGAS URLに差し替えてください ==== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxB9KV9bmIQ5EGTSTlKFjKJpessdSKDQG4JISpuWH2azbGJx30ptbyHdpRh-8SOd0-E/exec';
/* ======================================================= */

const app = document.getElementById('app');
let mainTab = 'review';

/* =====================================================
   共通：大タブの切り替え
===================================================== */
function switchMainTab(tab) {
  mainTab = tab;
  document.getElementById('mainTabReview').className = 'main-tab-btn' + (tab === 'review' ? ' active' : '');
  document.getElementById('mainTabAdmin').className = 'main-tab-btn' + (tab === 'admin' ? ' active' : '');
  if (tab === 'review') {
    renderReviewInit();
  } else {
    renderAdminInit();
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(str) { return escapeHtml(str); }

/* =====================================================
   レビュー入力側（回答者用）
   ※ 他の人の回答は一切取得しない
===================================================== */
let campaigns = [];
let selectedCampaign = null;

async function renderReviewInit() {
  app.innerHTML = '<div class="msg">読み込み中です…</div>';
  selectedCampaign = null;
  try {
    const res = await fetch(GAS_URL + '?action=getActiveCampaigns');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    campaigns = data;
    renderReview();
  } catch (err) {
    app.innerHTML = '<div class="msg">読み込みに失敗しました。時間をおいて再度お試しください。<br>(' + err.message + ')</div>';
  }
}

function renderReview() {
  if (!campaigns.length) {
    app.innerHTML = '<div class="msg">現在、募集中の試作品レビューはありません。</div>';
    return;
  }
  if (!selectedCampaign) {
    if (campaigns.length === 1) {
      selectedCampaign = campaigns[0];
      renderReviewForm();
      return;
    }
    let opts = '<option value="">選択してください</option>';
    campaigns.forEach((c, i) => {
      opts += `<option value="${i}">${escapeHtml(c.productName)}</option>`;
    });
    app.innerHTML = `
      <div class="card">
        <label>レビューする商品を選んでください</label>
        <select id="campaignSelect">${opts}</select>
      </div>`;
    document.getElementById('campaignSelect').addEventListener('change', (e) => {
      const idx = e.target.value;
      if (idx === '') return;
      selectedCampaign = campaigns[idx];
      renderReviewForm();
    });
    return;
  }
  renderReviewForm();
}

function renderReviewForm() {
  const c = selectedCampaign;
  let questionsHtml = '';
  (c.questions || []).forEach(q => {
    questionsHtml += `
      <label>${escapeHtml(q.label)}<span class="required">※</span></label>
      <textarea name="q_${q.id}" required></textarea>`;
  });

  app.innerHTML = `
    <div class="card">
      <div class="product-name">${escapeHtml(c.productName)}</div>
      ${c.features ? `<div class="product-features">${escapeHtml(c.features)}</div>` : ''}
      ${c.deadline ? `<div class="deadline">入力期限：${escapeHtml(c.deadline)}</div>` : ''}
    </div>
    <form id="reviewForm" class="card">
      <label>お名前<span class="required">※</span></label>
      <input type="text" name="reviewerName" required>

      <label>部署</label>
      <input type="text" name="department" placeholder="例：経理／広報／店舗など">

      ${questionsHtml}

      <button type="submit" class="block">この内容で送信する</button>
    </form>
  `;

  document.getElementById('reviewForm').addEventListener('submit', onSubmitReview);
}

async function onSubmitReview(e) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = '送信中…';

  const answers = {};
  (selectedCampaign.questions || []).forEach(q => {
    const el = form.querySelector(`[name="q_${q.id}"]`);
    answers[q.label] = el ? el.value : '';
  });

  const payload = {
    action: 'submitReview',
    campaignId: selectedCampaign.id,
    productName: selectedCampaign.productName,
    reviewerName: form.reviewerName.value,
    department: form.department.value,
    answers: answers
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    showReviewSuccess();
  } catch (err) {
    alert('送信に失敗しました。もう一度お試しください。\n(' + err.message + ')');
    btn.disabled = false;
    btn.textContent = 'この内容で送信する';
  }
}

function showReviewSuccess() {
  app.innerHTML = `
    <div class="success">
      <h2>ご回答ありがとうございました！</h2>
      <p>レビューを送信しました。</p>
      <button onclick="renderReviewInit()">別の商品もレビューする</button>
    </div>`;
}

/* =====================================================
   管理者用（合言葉で保護）
===================================================== */
let adminPassword = sessionStorage.getItem('review_admin_pw') || '';
let adminTab = 'new';
let editingCampaign = null;
let questionDraft = [];

function renderAdminInit() {
  if (adminPassword) {
    verifyAdminPassword();
  } else {
    renderAdminLogin();
  }
}

function renderAdminLogin() {
  app.innerHTML = `
    <div class="login-box card">
      <label>合言葉を入力してください</label>
      <input type="text" id="pwInput">
      <div class="actions" style="justify-content:center;">
        <button onclick="tryAdminLogin()">入る</button>
      </div>
    </div>`;
}

function tryAdminLogin() {
  adminPassword = document.getElementById('pwInput').value;
  verifyAdminPassword();
}

async function verifyAdminPassword() {
  try {
    const res = await fetch(GAS_URL + '?action=getAllCampaigns&password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (data.error) {
      alert('合言葉が違います');
      adminPassword = '';
      renderAdminLogin();
      return;
    }
    sessionStorage.setItem('review_admin_pw', adminPassword);
    adminTab = 'new';
    renderAdminMain();
  } catch (err) {
    alert('通信に失敗しました: ' + err.message);
  }
}

function renderAdminMain() {
  app.innerHTML = `
    <div class="sub-tabs">
      <button class="tab-btn ${adminTab==='new'?'active':''}" onclick="switchAdminTab('new')">質問を登録する</button>
      <button class="tab-btn ${adminTab==='list'?'active':''}" onclick="switchAdminTab('list')">案件一覧・編集</button>
      <button class="tab-btn ${adminTab==='results'?'active':''}" onclick="switchAdminTab('results')">結果を見る</button>
    </div>
    <div id="adminBody"></div>
  `;
  if (adminTab === 'new') renderNewForm();
  if (adminTab === 'list') renderList();
  if (adminTab === 'results') renderResults();
}

function switchAdminTab(tab) {
  adminTab = tab;
  editingCampaign = null;
  renderAdminMain();
}

/* ---------- 質問登録 ---------- */

function renderNewForm() {
  const c = editingCampaign || { productName:'', features:'', deadline:'', active:true, questions: defaultQuestions() };
  questionDraft = JSON.parse(JSON.stringify(c.questions || []));

  const body = document.getElementById('adminBody');
  body.innerHTML = `
    <div class="card">
      <label>商品名<span class="required">※</span></label>
      <input type="text" id="f_productName" value="${escapeAttr(c.productName)}">

      <label>特徴・説明（レビュー画面に表示されます）</label>
      <textarea id="f_features">${escapeHtml(c.features)}</textarea>

      <label>入力期限（任意）</label>
      <input type="date" id="f_deadline" value="${escapeAttr(c.deadline)}">

      <label>質問項目</label>
      <div id="questionList"></div>
      <button type="button" class="secondary" onclick="addQuestion()">＋ 質問を追加</button>

      <label style="margin-top:20px;">
        <input type="checkbox" id="f_active" ${c.active?'checked':''} style="width:auto;"> 現在レビュー募集中にする（オンにするとレビュー入力タブに表示されます）
      </label>

      <div class="actions">
        <button onclick="saveCampaign()">${editingCampaign ? '更新する' : 'この内容で登録する'}</button>
        ${editingCampaign ? '<button class="secondary" onclick="cancelEdit()">新規登録に戻る</button>' : ''}
      </div>
    </div>
  `;
  renderQuestionList();
}

function defaultQuestions() {
  return [
    {id:'q_'+Math.random().toString(36).slice(2), label:'年代'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'肌質'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'第一印象'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'感想'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'お客様受け'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'説明しやすさ'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'他社差別化'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'総合評価'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'推奨度（10点中）'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'部署コメント'},
    {id:'q_'+Math.random().toString(36).slice(2), label:'個人一言コメント'}
  ];
}

function renderQuestionList() {
  const el = document.getElementById('questionList');
  el.innerHTML = questionDraft.map((q, i) => `
    <div class="q-row">
      <input type="text" value="${escapeAttr(q.label)}" onchange="updateQuestionLabel(${i}, this.value)">
      <button type="button" class="danger" onclick="removeQuestion(${i})">削除</button>
    </div>
  `).join('');
}

function addQuestion() {
  questionDraft.push({ id: 'q_' + Math.random().toString(36).slice(2), label: '' });
  renderQuestionList();
}
function updateQuestionLabel(i, val) { questionDraft[i].label = val; }
function removeQuestion(i) { questionDraft.splice(i, 1); renderQuestionList(); }

async function saveCampaign() {
  const productName = document.getElementById('f_productName').value.trim();
  if (!productName) { alert('商品名を入力してください'); return; }
  const questions = questionDraft.filter(q => q.label.trim() !== '');

  const campaign = {
    id: editingCampaign ? editingCampaign.id : undefined,
    productName: productName,
    features: document.getElementById('f_features').value,
    deadline: document.getElementById('f_deadline').value,
    active: document.getElementById('f_active').checked,
    questions: questions
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveCampaign', password: adminPassword, campaign })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    alert('保存しました');
    editingCampaign = null;
    switchAdminTab('list');
  } catch (err) {
    alert('保存に失敗しました: ' + err.message);
  }
}

function cancelEdit() {
  editingCampaign = null;
  renderNewForm();
}

/* ---------- 案件一覧 ---------- */

async function renderList() {
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getAllCampaigns&password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const list = data.campaigns || [];
    if (!list.length) {
      body.innerHTML = '<div class="card msg">まだ案件がありません。「質問を登録する」タブから作成してください。</div>';
      return;
    }
    body.innerHTML = '<div class="card">' + list.map(c => `
      <div class="campaign-list-item">
        <div class="info">
          <div class="name">${escapeHtml(c.productName)}</div>
          <div class="meta">質問${(c.questions||[]).length}件${c.deadline ? '・期限 '+escapeHtml(c.deadline) : ''}</div>
        </div>
        <span class="badge ${c.active?'':'off'}">${c.active?'募集中':'非公開'}</span>
        <button class="secondary" onclick='editCampaign(${JSON.stringify(c.id)})'>編集</button>
        <button class="danger" onclick='deleteCampaignConfirm(${JSON.stringify(c.id)})'>削除</button>
      </div>
    `).join('') + '</div>';
    window._campaignsCache = list;
  } catch (err) {
    body.innerHTML = '<div class="card msg">読み込みに失敗しました: ' + err.message + '</div>';
  }
}

function editCampaign(id) {
  const c = (window._campaignsCache || []).find(c => c.id === id);
  if (!c) return;
  editingCampaign = c;
  adminTab = 'new';
  renderAdminMain();
}

async function deleteCampaignConfirm(id) {
  if (!confirm('この案件を削除します。よろしいですか？（レビュー履歴自体は消えません）')) return;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteCampaign', password: adminPassword, campaignId: id })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderList();
  } catch (err) {
    alert('削除に失敗しました: ' + err.message);
  }
}

/* ---------- 結果閲覧 ---------- */

async function renderResults() {
  const body = document.getElementById('adminBody');
  body.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getAllCampaigns&password=' + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const list = data.campaigns || [];
    let opts = list.map(c => `<option value="${escapeAttr(c.id)}">${escapeHtml(c.productName)}</option>`).join('');
    body.innerHTML = `
      <div class="card">
        <label>結果を見る案件</label>
        <select id="resultSelect">${opts}</select>
        <div class="actions">
          <button onclick="loadResults()">表示する</button>
        </div>
        <div id="resultTableWrap"></div>
      </div>`;
    window._campaignsCache = list;
    if (list.length) loadResults();
  } catch (err) {
    body.innerHTML = '<div class="card msg">読み込みに失敗しました: ' + err.message + '</div>';
  }
}

async function loadResults() {
  const select = document.getElementById('resultSelect');
  const campaignId = select.value;
  const campaign = (window._campaignsCache || []).find(c => c.id === campaignId);
  const wrap = document.getElementById('resultTableWrap');
  wrap.innerHTML = '<div class="msg">読み込み中…</div>';
  try {
    const res = await fetch(GAS_URL + '?action=getReviews&campaignId=' + encodeURIComponent(campaignId) + '&password=' + encodeURIComponent(adminPassword));
    const reviews = await res.json();
    if (reviews.error) throw new Error(reviews.error);
    if (!reviews.length) {
      wrap.innerHTML = '<div class="msg">まだ回答がありません。</div>';
      return;
    }
    const qLabels = (campaign ? campaign.questions : []).map(q => q.label);
    let html = '<table><tr><th>日時</th><th>名前</th><th>部署</th>';
    qLabels.forEach(l => html += `<th>${escapeHtml(l)}</th>`);
    html += '</tr>';
    reviews.forEach(r => {
      html += `<tr><td>${formatDate(r.timestamp)}</td><td>${escapeHtml(r.reviewerName)}</td><td>${escapeHtml(r.department)}</td>`;
      qLabels.forEach(l => html += `<td>${escapeHtml((r.answers||{})[l] || '')}</td>`);
      html += '</tr>';
    });
    html += '</table>';
    wrap.innerHTML = html;
  } catch (err) {
    wrap.innerHTML = '<div class="msg">読み込みに失敗しました: ' + err.message + '</div>';
  }
}

function formatDate(v) {
  const d = new Date(v);
  if (isNaN(d.getTime())) return v;
  return d.toLocaleString('ja-JP');
}

/* =====================================================
   起動
===================================================== */
switchMainTab('review');
</script>
</body>
</html>
